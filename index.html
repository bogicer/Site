<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SpireWorld – Вхід</title>
    <style>
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Nunito', sans-serif;
        }
        .login-card {
            background: #111114;
            border-radius: 24px;
            padding: 40px;
            width: 360px;
            border: 1px solid #2a2a2e;
            text-align: center;
        }
        .login-card h2 {
            color: white;
            margin-bottom: 8px;
        }
        .auth-input {
        display: block !important;
        visibility: visible !important;
        pointer-events: auto !important;
        }
        .login-card p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .login-card input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #1a1a1e;
            border: 1px solid #2a2a2e;
            color: white;
            border-radius: 12px;
            font-size: 16px;
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background: #F26419;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .error {
            color: #ff4444;
            margin-top: 12px;
            font-size: 13px;
        }
        a {
            color: #F26419;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>🔐 Вхід в SpireWorld</h2>
    <p>Введіть дані вашого акаунта</p>
    <input type="text" id="username" placeholder="Нікнейм" autocomplete="off">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="doLogin()">Увійти</button>
    <div id="errorMsg" class="error"></div>
    <div style="margin-top: 20px;"><a href="#" onclick="demoLogin()">🎮 Демо-вхід (vortex)</a></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBGRcQS_RNA4DWboldCjzBhkvLev2n8fLs",
        authDomain: "spireworld-30c51.firebaseapp.com",
        projectId: "spireworld-30c51",
        storageBucket: "spireworld-30c51.firebasestorage.app",
        messagingSenderId: "1029200336194",
        appId: "1:1029200336194:web:8b64a1a3d853b750b9e4db"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.doLogin = async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('errorMsg');
        if (!username || !password) {
            errorDiv.innerText = '❌ Заповніть всі поля';
            return;
        }
        const snapshot = await get(ref(db, `users/${username}`));
        if (!snapshot.exists()) {
            errorDiv.innerText = '❌ Користувача не існує';
            return;
        }
        const user = snapshot.val();
        if (atob(user.password) !== password) {
            errorDiv.innerText = '❌ Неправильний пароль';
            return;
        }
        localStorage.setItem('spireworld_current_user', username);
        window.location.href = 'index.html';
    };

    window.demoLogin = () => {
        localStorage.setItem('spireworld_current_user', 'vortex');
        window.location.href = 'index.html';
    };
</script>
</body>
</html>
