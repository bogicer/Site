<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вхід SpireWorld</title>
    <style>
        body {
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }
        .login-form {
            background: #111114;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #2a2a2e;
            width: 350px;
        }
        .login-form h2 {
            color: white;
            margin-bottom: 20px;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a1e;
            border: 1px solid #2a2a2e;
            color: white;
            border-radius: 8px;
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: #F26419;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .error {
            color: #ff4444;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="login-form">
    <h2>🔐 Вхід в акаунт</h2>
    <input type="text" id="username" placeholder="Нікнейм" autocomplete="off">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Увійти</button>
    <div id="error" class="error"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBGRcQS_RNA4DWboldCjzBhkvLev2n8fLs",
        authDomain: "spireworld-30c51.firebaseapp.com",
        projectId: "spireworld-30c51",
        storageBucket: "spireworld-30c51.firebasestorage.app",
        messagingSenderId: "1029200336194",
        appId: "1:1029200336194:web:8b64a1a3d853b750b9e4db"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.login = async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('error');
        
        if (!username || !password) {
            errorDiv.innerText = 'Заповніть всі поля';
            return;
        }
        
        const snapshot = await get(ref(db, `users/${username}`));
        if (!snapshot.exists()) {
            errorDiv.innerText = 'Користувача не існує';
            return;
        }
        const user = snapshot.val();
        if (atob(user.password) !== password) {
            errorDiv.innerText = 'Неправильний пароль';
            return;
        }
        
        localStorage.setItem('spireworld_current_user', username);
        window.location.href = 'index.html'; // перехід на головну сторінку
    };
</script>
</body>
</html>
